name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test
        run: cargo test --locked --all-targets --no-fail-fast
      - name: Run the demo
        run: cargo run --locked --quiet -- demo

  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy with the browser feature
        run: cargo clippy --locked --all-targets --features browser -- -D warnings
      - name: Check whitespace
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD

  msrv:
    name: Rust 1.89 (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test
        run: cargo +1.89.0 test --locked --all-targets
      - name: Check the browser feature
        run: cargo +1.89.0 check --locked --all-targets --features browser

  browser:
    name: JavaScript rendering
    runs-on: ubuntu-latest
    env:
      AUDITROO_CHROME: /usr/bin/google-chrome
      AUDITROO_REQUIRE_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Print the Chrome version
        run: '"$AUDITROO_CHROME" --version'
      - name: Test with real Chrome
        run: cargo test --locked --all-targets --features browser

  advisories:
    name: RustSec advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Scan Cargo.lock
        run: cargo audit --file Cargo.lock

  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build auditroo
        run: |
          cargo build --locked
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
      - name: Run the action on the demo
        id: demo
        uses: ./
        with:
          version: path
          args: demo
          html: demo-report.html
      - name: Check the action outputs
        env:
          EXIT_CODE: ${{ steps.demo.outputs.exit-code }}
          REPORT: ${{ steps.demo.outputs.report }}
        run: |
          test "$EXIT_CODE" = 0
          test -s "$REPORT"
          test -s demo-report.html
          auditroo report "$REPORT" --format markdown | grep -q "problems would hurt search"
