name: Release

# A tag like v0.1.0 builds the binaries for six platforms and publishes a
# GitHub release with them and checksums.txt. Run it by hand
# (workflow_dispatch) to build the binaries without publishing anything.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.asset }}
    needs: checks
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: auditroo-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: auditroo-linux-arm64
          - os: macos-15
            target: x86_64-apple-darwin
            asset: auditroo-darwin-amd64
          - os: macos-15
            target: aarch64-apple-darwin
            asset: auditroo-darwin-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: auditroo-windows-amd64.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: auditroo-windows-arm64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install rustup where the image has none
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
            .\rustup-init.exe -y --profile minimal --default-toolchain none
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Install zig for static Linux builds
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --user ziglang==0.13.0
          cargo install cargo-zigbuild --locked
      - name: Check that the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"$" Cargo.toml
      - name: Build
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cargo zigbuild --locked --release --target ${{ matrix.target }}
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi
          mkdir -p dist
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          cp "target/${{ matrix.target }}/release/auditroo$suffix" "dist/${{ matrix.asset }}"
      - name: Run the binary
        if: matrix.target != 'aarch64-unknown-linux-musl' && matrix.target != 'x86_64-apple-darwin'
        run: |
          "dist/${{ matrix.asset }}" --version
          "dist/${{ matrix.asset }}" demo > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: |
          cd dist
          sha256sum auditroo-* > checksums.txt
          cat checksums.txt
      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/auditroo-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/auditroo-* dist/checksums.txt
