[package]
name = "auditroo"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/vincentsch/auditroo"
description = "Checks a preview deployment for SEO mistakes and fails CI when a change would hurt search."

[lib]
name = "auditroo"
path = "src/lib.rs"

[[bin]]
name = "auditroo"
path = "src/main.rs"

[features]
default = []
browser = ["dep:chromiumoxide", "dep:tempfile"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
url = "2.5"
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
async-stream = "0.3"
encoding_rs = "0.8"
futures-core = "0.3"
futures-util = "0.3"
scraper = "0.24"
serde_json = "1"
regex = "1"
csv = "1.3"
glob = "0.3"
sha2 = "0.10"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
texting_robots = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
quick-xml = "0.41"
flate2 = "1"
time = { version = "=0.3.47", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
chromiumoxide = { version = "0.9.1", default-features = false, optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
axum = "0.8"
futures-util = "0.3"
assert_cmd = "2"
tempfile = "3"
predicates = "3"
